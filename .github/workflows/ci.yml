name: Task Manager CI

on: 
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      
      - name: checkout the code
        uses: actions/checkout@v6.1.0 

      - name: Setup NodeJs
        uses: actions/setup-node@v7.1.0 
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend files
        working-directory: ./frontend
        run: npm run build
  
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v6.1.0

      - name: Setup Node.JS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
          
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci 

  docker-build:
    runs-on: ubuntu-latest
    needs: [ frontend , backend ] 
    steps:
      - name: checkout the code
        uses: actions/checkout@v6.1.0 

      - name: Build Frontend docker image
        working-directory: ./frontend
        run: docker build -t khaledalsherbini/taskmanager-frontend:${{ github.sha }} . 

      - name: Trivy Security Scan for Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'khaledalsherbini/taskmanager-frontend:${{ github.sha }}'
          format: 'table'
          scan-type: image
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'

      - name: Build Backend docker image 
        working-directory: ./backend
        run: docker build -t khaledalsherbini/taskmanager-backend:${{ github.sha }} . 

      - name: Trivy Security Scan for Backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'khaledalsherbini/taskmanager-backend:${{ github.sha }}'
          format: 'table'
          scan-type: image
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}
     
      - name: Push Images to Docker Hub
        run : | 
           docker push khaledalsherbini/taskmanager-frontend:${{ github.sha }}
           docker push khaledalsherbini/taskmanager-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs:  docker-build
    steps:
       
       - name: Checkout repository
         uses: actions/checkout@v6.1.0
      
       - name: Setup ssh
         uses: webfactory/ssh-agent@v0.9.0
         with:
           ssh-private-key: ${{ secrets.EC2_SSH_KEY }} 

       - name: Add EC2 to known_hosts
         env:
           EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
         run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts 

       - name: Create deployment directory
         env:
           EC2_HOST: ${{ secrets.EC2_HOST }}
           EC2_USER: ${{ secrets.EC2_USER }}
         run: |
           ssh "$EC2_USER@$EC2_HOST" "mkdir -p ~/taskmanager"

       - name: Copy Compose file to EC2 and db migration file
         env:
           EC2_HOST: ${{ secrets.EC2_HOST }}
           EC2_USER: ${{ secrets.EC2_USER }}
         run: |
          scp docker-compose.yml "$EC2_USER@$EC2_HOST:~/taskmanager/docker-compose.yml"
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p ~/taskmanager/database/migrations"
          scp database/migrations/001_create_tasks.sql "$EC2_USER@$EC2_HOST:~/taskmanager/database/migrations/001_create_tasks.sql"
      
       - name: Retrieve DB password from AWS Secrets Manager
         env:
           EC2_HOST: ${{ secrets.EC2_HOST }}
           EC2_USER: ${{ secrets.EC2_USER }}
           GIT_COMMIT: ${{ github.sha }}
         run: |
           ssh "$EC2_USER@$EC2_HOST" "GIT_COMMIT='$GIT_COMMIT' bash -s" <<'REMOTE'
           set -euo pipefail

           cd ~/taskmanager

           DB_PASSWORD=$(aws secretsmanager get-secret-value \
           --secret-id taskmanager/prod/database \
           --region eu-north-1 \
           --query SecretString \
           --output text |
           jq -er ".DB_PASSWORD")

           umask 077
          
           printf 'DB_PASSWORD=%s\nIMAGE_TAG=%s\n' \
            "$DB_PASSWORD" "$GIT_COMMIT" > .env.tmp 
          
           chmod 600 .env.tmp 
          
           mv .env.tmp .env
           REMOTE
      
       - name: Deploy application on EC2
         env:
           EC2_HOST: ${{ secrets.EC2_HOST }}
           EC2_USER: ${{ secrets.EC2_USER }}
           
         run: |
           ssh "$EC2_USER@$EC2_HOST" '
             cd ~/taskmanager
             sudo docker compose pull
             sudo docker compose up -d db
             sudo docker compose run --rm migration
             sudo docker compose up -d --no-deps backend
             sudo docker compose up -d frontend
           '
