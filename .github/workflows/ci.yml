name: Task Manager CI

on: 
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      
      - name: checkout the code
        uses: actions/checkout@v6.1.0 

      - name: Setup NodeJs
        uses: actions/setup-node@v7.1.0 
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend files
        working-directory: ./frontend
        run: npm run build
  
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v6.1.0

      - name: Setup Node.JS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
          
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci 

  docker-build:
    runs-on: ubuntu-latest
    needs: [ frontend , backend ] 
    steps:
      - name: checkout the code
        uses: actions/checkout@v6.1.0 

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} 
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build Frontend docker image
        working-directory: ./frontend
        run: docker build -t khaledalsherbini/taskmanager-frontend:1.0 .

      - name: Build Backend docker image 
        working-directory: ./backend
        run: docker build -t khaledalsherbini/taskmanager-backend:1.0 .

      - name: Push Images to Docker Hub
        run : | 
           docker push khaledalsherbini/taskmanager-frontend:1.0 
           docker push khaledalsherbini/taskmanager-backend:1.0 
