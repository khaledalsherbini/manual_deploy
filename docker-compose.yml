services:
  frontend:
    image: khaledalsherbini/taskmanager-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "80:8080" 
    depends_on:
      backend:
        condition: service_healthy
  backend:
    image: khaledalsherbini/taskmanager-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskmanager
      DB_USER: taskuser
      DB_PASSWORD: ${DB_PASSWORD}
  
  migration: 
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy 
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: taskmanager
      PGUSER: taskuser
      PGPASSWORD: ${DB_PASSWORD}   
    
    entrypoint: ["psql"]
    command: ["-f", "/migrations/001_create_tasks.sql"]
     
    volumes:
      - ./database/migrations/001_create_tasks.sql:/migrations/001_create_tasks.sql:ro

    
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanager"]
     interval: 5s
     timeout: 5s
     retries: 5

    volumes:
      - task_manager_db_data:/var/lib/postgresql/data

volumes:
  task_manager_db_data:
    name: task_manager_db_data
